# base
bindsym $mod+Return exec $term
bindsym $mod+Shift+q kill
bindsym $mod+d exec $menu
# wm control
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit wm?' -B 'Yes' 'swaymsg exit'
bindsym $mod+Shift+r reload
# focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
# move
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
# layout
bindsym $mod+n splith
bindsym $mod+v splitv
bindsym $mod+s layout tabbed
bindsym $mod+Shift+s layout stacking
bindsym $mod+u layout toggle split # Undo layout
bindsym $mod+p focus parent
bindsym $mod+Shift+p focus child
bindsym $mod+o focus output right
# fullscreen
bindsym $mod+f fullscreen
# floating
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
# resize
mode "resize" {
    bindsym $left resize shrink width 5px or 5 ppt
    bindsym $down resize grow height 5px or 5 ppt
    bindsym $up resize shrink height 5px or 5 ppt
    bindsym $right resize grow width 5px or 5 ppt

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
# apps
bindsym $mod+w exec firefox
bindsym $mod+Shift+w exec firefox -P
bindsym $mod+e exec thunar
bindsym $mod+Mod1+End exec poweroff
